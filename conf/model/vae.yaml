# Model type: 'autoencoder' or 'unet'
model_type: autoencoder

# Latent space dimension
latent_dim: 128

# Learning rate
learning_rate: 0.001

# Optimizer settings
optimizer:
  name: adam
  weight_decay: 0.0001

# Scheduler settings
scheduler:
  use: true
  name: reduce_on_plateau
  patience: 5
  factor: 0.5

# Autoencoder specific settings
autoencoder:
  encoder_channels: [32, 64, 128, 256]
  decoder_channels: [256, 128, 64, 32]
  activation: relu
  use_batch_norm: true

# U-Net specific settings
unet:
  base_channels: 64
  depth: 4
  activation: relu
  use_batch_norm: true
